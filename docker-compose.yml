version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: taskapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/taskapi
      SECRET_KEY: change-me-in-production
      JWT_SECRET_KEY: change-me-jwt-in-production
    depends_on:
      - db

volumes:
  postgres_data:
